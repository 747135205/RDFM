training:
  lr: 0.01
  weight-decay: 0.0000001
  bs: 16
  scheduler: 'steplr'
#  gamma: 0.1
  gamma: 0.1
  step-size: 10
  rebalancing_fake: 0.21
  rebalancing_real: 1
  frames-per-video: 0.01 # Equidistant frames

model:
  image-size: 224
  patch-size: 7
  num-classes: 1
  dim: 1024
  depth: 6
  dim-head: 64
  heads: 8
  mlp-dim: 2048
  emb-dim: 16
  dropout: 0.15
  emb-dropout: 0.15
